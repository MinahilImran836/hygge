<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 180px;
      padding: 16px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #fff0f0;
      color: #463333;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    h3 {
      margin: 0 0 12px 0;
      font-size: 16px;
      color: #7d5a5a;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 26px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: #ccc;
      transition: .3s;
      border-radius: 26px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #e8b2d0;
    }
    input:checked + .slider:before {
      transform: translateX(24px);
    }
    input:focus-visible + .slider {
      outline: 2px solid #7d5a5a;
      outline-offset: 2px;
    }
    .status {
      margin: 10px 0 0;
      font-size: 12px;
      color: #8a6f6f;
    }
  </style>
</head>
<body>
  <h3>Hygge</h3>
  <label class="switch">
    <input type="checkbox" id="cozy-toggle" aria-label="Cozy room">
    <span class="slider"></span>
  </label>
  <p class="status" id="cozy-status"></p>
  <script src="popup.js"></script>
</body>
</html>
